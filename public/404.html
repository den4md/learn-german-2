<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Learn German</title>
    <script>
      (() => {
        const basePath = '/learn-german-2'
        const routePath = window.location.pathname.startsWith(`${basePath}/`)
          ? window.location.pathname.slice(basePath.length)
          : window.location.pathname
        const route = `${routePath}${window.location.search}${window.location.hash}`
        window.location.replace(`${basePath}/?route=${encodeURIComponent(route)}`)
      })()
    </script>
  </head>
  <body></body>
</html>
